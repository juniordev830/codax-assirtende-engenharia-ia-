version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      vite-tooling:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
      react-runtime:
        patterns:
          - "react"
          - "react-dom"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
